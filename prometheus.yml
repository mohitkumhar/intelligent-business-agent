global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── Web Dashboard (Flask on :5001) ─────────────────────────────
  - job_name: "web-dashboard"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["web-dashboard:5001"]
        labels:
          app: "web-dashboard"

  # ── Backend Agent (Flask on :5000) ─────────────────────────────
  - job_name: "backend-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          app: "backend-agent"

  # ── Prometheus itself ──────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
